<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#3a0009" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#100507" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="boxFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0709"/>
      <stop offset="55%" stop-color="#0d0405"/>
      <stop offset="100%" stop-color="#070203"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050202"/>
      <stop offset="100%" stop-color="#120607"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c97a4a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#70000d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#glow)"/>
  <ellipse cx="600" cy="1260" rx="330" ry="46" fill="#000000" opacity="0.55"/>
  <!-- box side -->
  <path d="M310 430 L310 1120 L430 1180 L430 480 Z" fill="url(#boxSide)"/>
  <!-- box front face -->
  <rect x="430" y="410" width="470" height="770" rx="10" fill="url(#boxFace)" stroke="#c97a4a" stroke-opacity="0.35"/>
  <rect x="430" y="410" width="470" height="770" rx="10" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <!-- lid seam -->
  <line x1="430" y1="560" x2="900" y2="560" stroke="#c97a4a" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- monogram -->
  <text x="665" y="820" font-family="Georgia, serif" font-size="150" fill="#f5f1f2" text-anchor="middle" opacity="0.92">SB</text>
  <line x1="595" y1="850" x2="735" y2="850" stroke="#c97a4a" stroke-width="1.5" opacity="0.7"/>
  <text x="665" y="905" font-family="Georgia, serif" font-size="34" letter-spacing="8" fill="#a99fa2" text-anchor="middle">SLOW BURN</text>
  <!-- fine pattern -->
  <g stroke="#c97a4a" stroke-opacity="0.12">
    <line x1="460" y1="620" x2="870" y2="620"/>
    <line x1="460" y1="1120" x2="870" y2="1120"/>
  </g>
  <text x="600" y="1420" font-family="Georgia, serif" font-size="22" letter-spacing="6" fill="#a99fa2" text-anchor="middle" opacity="0.6">NAUGHTY CARDS — PLACEHOLDER VISUAL</text>
</svg>
